<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIHUB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f12;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 30px;
      background: #17171c;
      border-bottom: 1px solid #292930;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .search {
      margin-left: auto;
      width: 300px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #26262d;
      color: white;
      outline: none;
    }

    main {
      padding: 35px;
    }

    h1 {
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 22px;
    }

    .card {
      background: #19191f;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #292930;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }

    .info {
      padding: 12px;
    }

    .title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .sub {
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ANIHUB</div>
  <input class="search" placeholder="애니 검색...">
</header>

<main>
  <h1>인기 애니</h1>

  <div class="grid">

    <div class="card">
      <div class="poster">POSTER</div>
      <div class="info">
        <div class="title">Anime 01</div>
        <div class="sub">TV · 12화</div>
      </div>
    </div>

    <div class="card">
      <div class="poster">POSTER</div>
      <div class="info">
        <div class="title">Anime 02</div>
        <div class="sub">TV · 24화</div>
      </div>
    </div>

    <div class="card">
      <div class="poster">POSTER</div>
      <div class="info">
        <div class="title">Anime 03</div>
        <div class="sub">TV · 12화</div>
      </div>
    </div>

  </div>
</main>

</body>
</html>
